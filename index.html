<style>
:root{
  --frame:hsl(0 0% 97%);
  --background:hsl(0 0% 100%);
  --foreground:hsl(0 0% 3.9%);
  --muted:hsl(0 0% 45.1%);
  --muted-bg:hsl(0 0% 96%);
  --border:hsl(0 0% 89.8%);
  --success:#2f9e5b;
  --destructive:hsl(0 72% 51%);
  --radius:12px;
  --font:"Geist","Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--frame);color:var(--foreground);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding:8px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--foreground);outline-offset:3px;border-radius:var(--radius)}

.shell{min-height:100%;background:var(--background);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;height:56px;padding:0 24px;border-bottom:1px solid var(--border)}
.bar .mark{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px}
.bar .mark i{border-radius:2px;background:#a3a3a3}
.bar .mark i:first-child{background:var(--foreground)}
.bar .mark i:last-child{background:#d4d4d4}

main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:40px 24px 56px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.head p,.date{color:var(--muted);font-size:14px}
.date{white-space:nowrap}

.list{display:flex;flex-direction:column;gap:16px}
.card{display:grid;grid-template-columns:1fr 1fr;min-height:260px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--background);transition:border-color .15s}
.card:hover{border-color:hsl(0 0% 78%)}

.info{display:flex;flex-direction:column;padding:28px}
.logo{width:40px;height:40px;border-radius:9px;box-shadow:0 0 0 1px var(--border)}
.info h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:16px}
.desc{color:var(--muted);font-size:14px;margin-top:4px;max-width:44ch}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:20px;font-size:13px;color:var(--muted)}
.status{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:#d4d4d4}
[data-state=up] .dot{background:var(--success)}
[data-state=down] .dot{background:var(--destructive)}
.open{color:var(--foreground);font-weight:500}
.card:hover .open{text-decoration:underline;text-underline-offset:3px}

.preview{position:relative;background:var(--muted-bg);border-left:1px solid var(--border);overflow:hidden}
.preview img{position:absolute;top:28px;left:28px;width:760px;max-width:none;height:auto;border:1px solid var(--border);border-radius:8px 0 0 0;
  box-shadow:0 1px 2px hsl(0 0% 0% / .04);transition:transform .25s}
.card:hover .preview img{transform:translate(-4px,-4px)}

@media (max-width:820px){
  body{padding:0} .shell{border:0;border-radius:0}
  .head{flex-direction:column;gap:2px}
  .card{grid-template-columns:1fr}
  .preview{height:200px;border-left:0;border-top:1px solid var(--border)}
  .preview img{width:600px}
}
@media (prefers-reduced-motion:reduce){ .preview img{transition:none} }
</style>
</head>

<div class="shell">
  <header class="bar"><span class="mark"><i></i><i></i><i></i><i></i></span><span>Apps</span></header>
  <main>
    <div class="head">
      <div>
        <h1>Aplicaciones</h1>
        <p>Accesos a las apps que tengo desplegadas.</p>
      </div>
      <span class="date" id="date"></span>
    </div>
    <div class="list" id="grid"></div>
  </main>
</div>

<script>
/* Cambia solo `url`: absoluta (http://10.0.0.20:8001) o relativa (/projekt/). */
const APPS = [
  { id:'projekt',  name:'Projekt',  url:'http://projekt.lan',
    desc:'Órdenes de trabajo, planning, proyectos y RRHH para empresas de servicios técnicos.' },
  { id:'finstack', name:'FinStack', url:'http://finstack.lan',
    desc:'Cuentas, gastos, presupuestos y objetivos de ahorro.' },
  { id:'wrenk',    name:'Wrenk',    url:'http://wrenk.lan',
    desc:'Repostajes, mantenimientos y coste por kilómetro de cada vehículo.' },
];

const tpl = id => document.getElementById(id).innerHTML.trim();
const host = u => u.replace(/^https?:\/\//,'').replace(/\/$/,'');

document.getElementById('grid').innerHTML = APPS.map(a => `
  <a class="card" href="${a.url}" id="${a.id}" data-state="wait">
    <div class="info">
      ${tpl('lg-'+a.id)}
      <h2>${a.name}</h2>
      <p class="desc">${a.desc}</p>
      <div class="foot">
        <span class="status"><span class="dot"></span><span>${host(a.url)}</span></span>
        <span class="open">Abrir ${a.name}</span>
      </div>
    </div>
    <div class="preview" aria-hidden="true"><img src="${tpl('shot-'+a.id)}" alt="" width="1440" height="900"></div>
  </a>`).join('');

async function ping(a){
  const el = document.getElementById(a.id);
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
  try { await fetch(a.url, { mode:'no-cors', cache:'no-store', signal:ctl.signal }); el.dataset.state = 'up'; }
  catch { el.dataset.state = 'down'; }
  clearTimeout(t);
  el.querySelector('.status').title = el.dataset.state === 'up' ? 'Responde' : 'Sin respuesta';
}
const pingAll = () => APPS.forEach(ping);
pingAll(); setInterval(pingAll, 30000);

const d = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
document.getElementById('date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
</script>
